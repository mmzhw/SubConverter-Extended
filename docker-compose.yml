# SubConverter-Extended 的 Compose 示例 / Example compose for SubConverter-Extended.

services:
  subconverter-extended:
    container_name: SubConverter-Extended
    image: aethersailor/subconverter-extended:latest
    ports:
      # 单一对外端口：nginx 托管前端并反代 subconverter。默认继续使用 25500；
      # 可用 WEB_PORT 覆盖宿主机侧和容器内 nginx 监听端口。
      # Single public port: nginx serves the Web UI and proxies subconverter.
      # The default stays 25500; set WEB_PORT to override both host and nginx ports.
      - "${WEB_PORT:-25500}:25500/tcp"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEB_PORT: "25500"
      SUBCONVERTER_LISTEN_PORT: "25501"
      SUBCONVERTER_SHORT_LINKS_FILE: "/base/short-links/links.json"
      # 服务器短链管理密码。留空时容器启动脚本会在 /base/short-links/admin-password
      # 自动生成并持久化一个随机 token；也可以显式设置此环境变量覆盖。
      # Server short-link management password. Leave empty to let the container
      # generate a persistent random token at /base/short-links/admin-password,
      # or set this environment variable to override it.
      SUBCONVERTER_SHORT_LINK_PASSWORD: ${SUBCONVERTER_SHORT_LINK_PASSWORD:-}
      SUBCONVERTER_SHORT_LINK_MAX_ENTRIES: "500"
      # WEB_PORT 控制 nginx 的公开入口；SUBCONVERTER_LISTEN_PORT 是容器内后端回环端口，
      # 保持与 WEB_PORT 不同以避免 nginx 与后端争抢同一个端口。
      # WEB_PORT is the public nginx entry; SUBCONVERTER_LISTEN_PORT is the
      # backend loopback port inside the container and must stay different.
      # 按需取消注释并修改；环境变量会覆盖 pref.toml 中的对应配置。
      # Uncomment and edit as needed; environment variables override pref.toml.
      # MANAGED_CONFIG_PREFIX: "http://your-domain-or-ip:25500"
      # 默认 lan 保持既有内网行为；确认公网可达的部署请显式选择 public 或 strict。
      # Default lan preserves existing LAN behavior. If Internet reachability is
      # confirmed, explicitly select public or strict.
      # SUBCONVERTER_SECURITY_PROFILE: public
      # SUBCONVERTER_ALLOW_PUBLIC_UPLOAD: "false"
      # 三种模式共用同一执行路径。force_max 在硬件探测完整时应用静态启动预算；旧指纹只作为已弃用的可选硬件 pin。所有模式保留有限请求截止时间。
      # All modes share one execution path. force_max applies a static startup
      # budget when hardware detection is complete; the legacy fingerprint is
      # only an optional deprecated hardware pin. Deadlines stay finite.
      # SUBCONVERTER_RESOURCE_CONTROL: compat
      # SUBCONVERTER_FORCE_MAX_CURVE_FINGERPRINT: ""
      # SUBCONVERTER_REQUEST_DEADLINE_MS: "15000"
      # SUBCONVERTER_RESPONSE_CACHE_MAX_BYTES: "8388608"
      # Dashboard 防爆破默认只信任 socket peer。只有容器端口不对外直通、且入口代理会覆盖所选头时才同时配置以下两项。
      # Dashboard brute-force protection trusts only the socket peer by default. Set both only when the container is not directly reachable and the edge proxy overwrites the selected header.
      # SUBCONVERTER_DASHBOARD_CLIENT_IP_HEADER: x-forwarded-for
      # SUBCONVERTER_DASHBOARD_TRUSTED_PROXY_CIDRS: "172.18.0.0/16"
    volumes:
      # 启动前请先创建 ./base/pref.toml；不要将整个 ./base 挂载到 /base，
      # 否则会遮盖镜像内随版本更新的规则和模板。
      # Create ./base/pref.toml before startup. Do not mount all of ./base to /base,
      # or image-provided rules and templates will be hidden.
      - "./base/pref.toml:/base/pref.toml:ro"
      # 持久化 /dashboard 统计数据；仅在 pref.toml 中启用 statistics 后写入。
      # Persist /dashboard statistics; data is written only when statistics is enabled.
      - "./stats:/base/stats"
      # 持久化短链映射数据，避免重建容器后短链失效。
      # Persist short-link mappings so generated short URLs survive container recreation.
      - "./short-links:/base/short-links"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
