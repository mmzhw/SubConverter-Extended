name: Smoke test Docker image
description: Run a Docker image and verify that the SubConverter HTTP endpoint responds.

inputs:
  image:
    description: Image reference, preferably pinned by digest.
    required: true
  platform:
    description: Docker platform to run, such as linux/amd64 or linux/arm/v7.
    required: true
  port:
    description: Container port exposed by SubConverter.
    required: false
    default: "25500"
  expected-version:
    description: Expected OCI and compiled version value.
    required: true
  expected-revision:
    description: Expected full OCI revision; runtime BUILD_ID uses its seven-character prefix.
    required: true
  expected-build-date:
    description: Expected OCI build timestamp.
    required: true

runs:
  using: composite
  steps:
    - name: Run image and check /version
      shell: bash
      run: |
        set -euo pipefail

        IMAGE="${{ inputs.image }}"
        PLATFORM="${{ inputs.platform }}"
        CONTAINER_PORT="${{ inputs.port }}"
        EXPECTED_VERSION="${{ inputs.expected-version }}"
        EXPECTED_REVISION="${{ inputs.expected-revision }}"
        EXPECTED_BUILD_DATE="${{ inputs.expected-build-date }}"
        CID=""
        POLICY_CID=""
        cleanup() {
          if [ -n "$POLICY_CID" ]; then
            docker rm -f "$POLICY_CID" >/dev/null 2>&1 || true
          fi
          if [ -n "$CID" ]; then
            docker rm -f "$CID" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT

        CID="$(docker run -d --platform "$PLATFORM" -e PORT="$CONTAINER_PORT" -p "127.0.0.1::${CONTAINER_PORT}" "$IMAGE")"

        HOST_PORT="$(docker port "$CID" "${CONTAINER_PORT}/tcp" | awk -F: 'END {print $NF}')"
        URL="http://127.0.0.1:${HOST_PORT}/version"
        FIXTURE_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tests/fixtures"

        docker exec "$CID" sh -c '
          test "${TZ:-}" = "Asia/Shanghai"
          test -e /usr/share/zoneinfo/Asia/Shanghai
          test "$(date +%z)" = "+0800"
          test ! -e /base/Custom_OpenClash_Rules
        '
        if [ "$(docker inspect --format '{{ if index .Config.Labels "com.aethersailor.custom-openclash-rules.revision" }}present{{ end }}' "$CID")" = "present" ]; then
          echo "Image still contains the removed Custom_OpenClash_Rules revision label." >&2
          exit 1
        fi

        for _ in $(seq 1 30); do
          if curl -fsS "$URL" >/tmp/subconverter-smoke.out; then
            head -c 200 /tmp/subconverter-smoke.out
            # The container generates a random short-link admin password when
            # SUBCONVERTER_SHORT_LINK_PASSWORD is empty. Read it back so the
            # smoke suite can exercise the short-link admin endpoints instead
            # of skipping them.
            SHORT_LINK_PASSWORD="$(docker exec "$CID" cat "${SUBCONVERTER_SHORT_LINK_PASSWORD_FILE:-/base/short-links/admin-password}" 2>/dev/null || true)"
            export SHORT_LINK_PASSWORD
            python3 scripts/verify_container_image_identity.py \
              --container "$CID" \
              --url "$URL" \
              --expected-version "$EXPECTED_VERSION" \
              --expected-revision "$EXPECTED_REVISION" \
              --expected-build-date "$EXPECTED_BUILD_DATE"
            python3 scripts/run-subconverter-smoke.py \
              --base-url "http://127.0.0.1:${HOST_PORT}" \
              --short-link-password "$SHORT_LINK_PASSWORD" \
              --remote-subscription-url "${FIXTURE_BASE}/sample-subscription.txt" \
              --mihomo-raw-subscription-url "${FIXTURE_BASE}/mihomo-raw-subscription.txt" \
              --mihomo-yaml-subscription-url "${FIXTURE_BASE}/mihomo-provider-subscription.yml" \
              --legacy-subscription-url "${FIXTURE_BASE}/legacy-surge-subscription.conf" \
              --verify-non-clash
            python3 scripts/run-no-resolve-smoke.py \
              --base-url "http://127.0.0.1:${HOST_PORT}" \
              --fixture-base-url "${FIXTURE_BASE}"
            route_status="$(curl -sS -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:${HOST_PORT}/Custom_OpenClash_Rules/main/rule/example.yaml")"
            test "$route_status" = "404"

            docker logs "$CID" >/tmp/subconverter-security-default.log 2>&1
            grep -F "SECURITY_PROFILE_EFFECTIVE profile=lan source=file:toml" \
              /tmp/subconverter-security-default.log
            grep -F "SECURITY_UPLOAD_EFFECTIVE profile=lan configured_allow_public_upload=false source=file:toml effective=allowed reason=lan-compatibility" \
              /tmp/subconverter-security-default.log
            # This action is shared by two image shapes. The amd64/arm64 image
            # puts nginx in front and keeps the backend on 127.0.0.1:25501; the
            # armv7 cross build has no nginx and serves the public port straight
            # from the backend. Only the nginx-fronted shape can promise that
            # the backend never binds a wildcard address, and only there is the
            # absence of SECURITY_EXPOSURE_POSSIBLE meaningful -- without a
            # reverse proxy the backend *is* the wildcard listener and logs it.
            if docker exec "$CID" sh -c 'command -v nginx >/dev/null 2>&1'; then
              if grep -Fq "SECURITY_EXPOSURE_POSSIBLE" /tmp/subconverter-security-default.log; then
                echo "The subconverter backend must not bind a wildcard address behind nginx." >&2
                exit 1
              fi
              LISTEN_OUTPUT="$(docker exec "$CID" netstat -ltn 2>/dev/null || true)"
              if [ -n "$LISTEN_OUTPUT" ]; then
                printf '%s\n' "$LISTEN_OUTPUT" | awk '
                  $4 ~ /:25501$/ && $4 !~ /^127\./ { bad = 1 }
                  END {
                    if (bad) {
                      print "Backend port 25501 is not bound to loopback." > "/dev/stderr"
                      exit 1
                    }
                  }'
              fi
            fi

            POLICY_CID="$(docker run -d --platform "$PLATFORM" \
              -e PORT=25501 \
              -e SUBCONVERTER_SECURITY_PROFILE=publci \
              -e SUBCONVERTER_ALLOW_PUBLIC_UPLOAD=truthy \
              "$IMAGE")"
            policy_ready=false
            for _ in $(seq 1 20); do
              docker logs "$POLICY_CID" >/tmp/subconverter-security-policy.log 2>&1 || true
              if grep -Fq "SECURITY_PROFILE_INVALID_FALLBACK source=environment input='publci' effective=lan compatibility_fallback=true" \
                  /tmp/subconverter-security-policy.log \
                && grep -Fq "SECURITY_UPLOAD_VALUE_INVALID source=environment input='truthy' effective=false" \
                  /tmp/subconverter-security-policy.log; then
                policy_ready=true
                break
              fi
              if ! docker ps --filter "id=$POLICY_CID" --format '{{.ID}}' | grep -q .; then
                cat /tmp/subconverter-security-policy.log
                exit 1
              fi
              sleep 1
            done
            if [ "$policy_ready" != true ]; then
              cat /tmp/subconverter-security-policy.log
              exit 1
            fi
            exit 0
          fi

          if ! docker ps --filter "id=$CID" --format '{{.ID}}' | grep -q .; then
            docker logs "$CID" || true
            exit 1
          fi

          sleep 2
        done

        docker logs "$CID" || true
        exit 1
