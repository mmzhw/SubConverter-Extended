name: Sync Docker Hub description

on:
  push:
    branches:
      - master
    paths:
      - .github/DOCKERHUB_DESCRIPTION.md
      # A change to the sync steps themselves should re-run the sync, so the
      # published description is refreshed with the new logic.
      - .github/workflows/sync-dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dockerhub-description
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Update Docker Hub repository description
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.ci.cleanup_container_registry import (
              CleanupError,
              _json_request,
              _request,
              dockerhub_token,
          )

          username = os.environ.get("DOCKERHUB_USERNAME", "")
          secret = os.environ.get("DOCKERHUB_TOKEN", "")
          # GitHub stores a secret byte-for-byte, so a stray trailing newline
          # or space survives. docker/login-action trims it, which is why the
          # release workflow works, but a raw API call rejects it with 401.
          username = username.strip()
          secret = secret.strip()
          try:
              token = dockerhub_token(username, secret)
          except CleanupError as exc:
              print(f"::error::Docker Hub authentication failed: {exc}. "
                    f"username_set={bool(username)} secret_length={len(secret)}")
              raise SystemExit(1)
          # The namespace must be the account that owns this image. It was
          # left as the upstream namespace, so the PATCH targeted a
          # repository this token cannot write to and the description never
          # synced.
          url = (
              "https://hub.docker.com/v2/namespaces/mmzhw51/"
              "repositories/subconverter-extended"
          )
          expected = {
              "description": "多客户端订阅转换后端，重点增强 Mihomo Provider 与远程资源。",
              "full_description": Path(
                  ".github/DOCKERHUB_DESCRIPTION.md"
              ).read_text(encoding="utf-8"),
          }
          try:
              _request(
                  "PATCH",
                  url,
                  headers={"Authorization": f"Bearer {token}"},
                  payload=expected,
                  expected=(200, 202, 204),
              )
              current, _headers = _json_request("GET", url)
          except CleanupError as exc:
              print(f"::error::Docker Hub description update failed: {exc}")
              raise SystemExit(1)
          if not isinstance(current, dict) or any(
              current.get(key) != value for key, value in expected.items()
          ):
              mismatched = [
                  key for key, value in expected.items()
                  if not isinstance(current, dict) or current.get(key) != value
              ]
              print(
                  "::error::Docker Hub description readback mismatch on: "
                  + ", ".join(mismatched)
              )
              raise SystemExit(1)
          print("Docker Hub description synced.")
          PY
