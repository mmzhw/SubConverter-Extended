name: Sync Docker Hub description

on:
  push:
    branches:
      - master
    paths:
      - .github/DOCKERHUB_DESCRIPTION.md
      # A change to the sync steps themselves should re-run the sync, so the
      # published description is refreshed with the new logic.
      - .github/workflows/sync-dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dockerhub-description
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Update Docker Hub repository description
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.ci.cleanup_container_registry import (
              CleanupError,
              _json_request,
              _request,
              dockerhub_token,
          )

          # Docker Hub refuses repository-description writes from a personal
          # access token (docker/hub-feedback#1927); the same call works with
          # an account password. So prefer an optional DOCKERHUB_PASSWORD and
          # fall back to the PAT, which will 403 until Docker lifts that limit.
          username = os.environ.get("DOCKERHUB_USERNAME", "").strip()
          password = os.environ.get("DOCKERHUB_PASSWORD", "").strip()
          pat = os.environ.get("DOCKERHUB_TOKEN", "").strip()
          # GitHub stores a secret byte-for-byte, so a pasted value keeps any
          # trailing newline; docker/login-action trims it, a raw API call
          # does not.
          if password:
              secret = password
              auth = "password"
          else:
              secret = pat
              auth = "pat"
          if not username or not secret:
              print("::warning::DOCKERHUB_USERNAME and a credential secret are "
                    "required to sync the description; skipping.")
              raise SystemExit(0)

          url = (
              "https://hub.docker.com/v2/namespaces/mmzhw51/"
              "repositories/subconverter-extended"
          )
          expected = {
              "description": "多客户端订阅转换后端，重点增强 Mihomo Provider 与远程资源。",
              "full_description": Path(
                  ".github/DOCKERHUB_DESCRIPTION.md"
              ).read_text(encoding="utf-8"),
          }

          try:
              if auth == "password":
                  data, _headers = _json_request(
                      "POST",
                      "https://hub.docker.com/v2/users/login/",
                      payload={"username": username, "password": secret},
                  )
                  token = data.get("token", "") if isinstance(data, dict) else ""
                  if not token:
                      raise CleanupError("login did not return a session token")
              else:
                  token = dockerhub_token(username, secret)
          except CleanupError as exc:
              print(f"::error::Docker Hub authentication failed ({auth}): {exc}")
              raise SystemExit(1)

          try:
              _request(
                  "PATCH",
                  url,
                  headers={"Authorization": f"Bearer {token}"},
                  payload=expected,
                  expected=(200, 202, 204),
              )
              current, _headers = _json_request("GET", url)
          except CleanupError as exc:
              if auth == "pat" and "HTTP 403" in str(exc):
                  print(
                      "::warning::Docker Hub refuses description writes from a "
                      "personal access token (docker/hub-feedback#1927). The "
                      "image push is unaffected. To automate this, add a "
                      "DOCKERHUB_PASSWORD secret holding the account password; "
                      "otherwise update the Overview by hand."
                  )
                  raise SystemExit(0)
              print(f"::error::Docker Hub description update failed ({auth}): {exc}")
              raise SystemExit(1)

          if not isinstance(current, dict) or any(
              current.get(key) != value for key, value in expected.items()
          ):
              mismatched = [
                  key for key, value in expected.items()
                  if not isinstance(current, dict) or current.get(key) != value
              ]
              print("::error::Docker Hub description readback mismatch on: "
                    + ", ".join(mismatched))
              raise SystemExit(1)
          print(f"Docker Hub description synced via {auth}.")
          PY
